name: Release Tankhor Desktop App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          node -e "if (require('fs').existsSync('package-lock.json')) require('fs').unlinkSync('package-lock.json')"
          npm install

      - name: Set Tauri Key Password
        shell: bash
        env:
          KEY_PASS: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_PASS" ]; then
            echo "TAURI_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          fi

      - name: Build Tauri App & Sign Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tankhor Desktop ${{ github.ref_name }}'
          releaseBody: 'Automated Tankhor signed update release build.'
          releaseDraft: false
          prerelease: false
          tauriScript: npx tauri
